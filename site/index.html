<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tino Cardenes · Pianist, Composer, Computer Scientist</title>
    <meta name="description" content="Classical and jazz pianist, composer, and computer scientist based in Pittsburgh. Recordings, lead sheets, software, and projects that combine music and computation." />
    <link rel="canonical" href="https://tinocardenes.com" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tinocardenes.com" />
    <meta property="og:title" content="Tino Cardenes · Pianist, Composer, Computer Scientist" />
    <meta property="og:description" content="Classical and jazz pianist, composer, and computer scientist based in Pittsburgh." />
    <meta property="og:image" content="https://tinocardenes.com/images/portrait.jpg" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#2b3d57" />
    <!-- Icons from site/favicon/. /favicon.ico stays at the root, where browsers and crawlers look by default. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,600&family=Cormorant+SC:wght@500&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Music&display=swap" /> -->
    <!-- Icons in the toolbar (fa-brands, fa-solid). -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link rel="stylesheet" href="/styles.css" />
    <!-- Page turning is done by StPageFlip (MIT), pinned to one version. -->
    <script type="importmap">
      { "imports": { "page-flip": "https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.module.js" } }
    </script>
    <script type="module" src="/js/main.js"></script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Tino Cardenes",
        "url": "https://tinocardenes.com",
        "image": "https://tinocardenes.com/images/portrait.jpg",
        "jobTitle": "Pianist, Composer, Computer Scientist",
        "sameAs": [
          "https://www.youtube.com/@tinocardenes",
          "https://www.instagram.com/tinocardenes/",
          "https://github.com/CardenesMa"
        ]
      }
    </script>
  </head>
  <body class="m-0 min-h-dvh bg-desk text-ink font-serif antialiased">
    <!-- Three columns: the site and its links on the left, the pager in the middle, elsewhere on the right.
         On narrow screens only Menu, the pager and the icons stay. -->
    <header class="sticky top-0 z-20 grid grid-cols-[1fr_auto_1fr] items-center gap-4 h-bar px-6 bg-bar/95 backdrop-blur text-bar-ink border-b border-bar-line max-spread:gap-2 max-spread:px-3">
      <nav class="flex items-baseline gap-5 font-caps tracking-wide" aria-label="Site">
        <!-- .nav-link: an underline that fades in on hover (src/styles.css). -->
        <a class="nav-link text-henle text-lg" href="#cover">Tino Cardenes</a>
        <span class="max-spread:hidden" aria-hidden="true">|</span>
        <a class="nav-link text-lg hover:text-henle" href="#toc">Contents</a>
        <a class="nav-link text-lg hover:text-henle max-spread:hidden" href="#back">Contact</a>
      </nav>

      <div class="flex items-center gap-1 tabular-nums">
        <button type="button" class="tool text-xl" data-turn="prev" aria-label="Previous pages"><i class="fa-solid fa-chevron-left"></i></button>
        <span class="min-w-[5.5em] text-center"><span data-pager-pages>1</span> / <span data-pager-total></span></span>
        <button type="button" class="tool text-xl" data-turn="next" aria-label="Next pages"><i class="fa-solid fa-chevron-right"></i></button>
      </div>

      <nav class="flex gap-4 justify-self-end text-bar-ink/65" aria-label="Elsewhere">
        <a class="tool" href="https://www.youtube.com/@tinocardenes" target="_blank" rel="noopener noreferrer" aria-label="YouTube"><i class="fa-brands fa-youtube nav-link" aria-hidden="true"></i></a>
        <a class="tool" href="https://www.instagram.com/tinocardenes/" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><i class="fa-brands fa-instagram nav-link" aria-hidden="true"></i></a>
        <a class="tool" href="https://github.com/CardenesMa" target="_blank" rel="noopener noreferrer" aria-label="GitHub"><i class="fa-brands fa-github nav-link" aria-hidden="true"></i></a>
        <a class="tool" href="mailto:cardenestino@gmail.com" aria-label="Email"><i class="fa-solid fa-envelope nav-link" aria-hidden="true"></i></a>
      </nav>
    </header>

    <!-- The vertical padding adds up to 2.75rem at every size; .book-frame (src/styles.css) counts on it to fit the window. -->
    <main class="relative pt-7 px-18 pb-4 overflow-x-clip max-spread:p-3 max-spread:pb-8">
      <div class="book-frame">
        <!-- The pages are built from book.md. data-plate is printed at the foot of every page. -->
        <div class="book" data-book data-source="/book.md" data-plate="©Tino Cardenes 2026"></div>
      </div>
      <p class="sr-only" aria-live="polite" data-announcer></p>


      <noscript>
        <p class="max-w-xl mx-auto my-12 px-5 py-4 bg-paper text-lg">
          This site is a book that needs JavaScript to turn its pages.
          Reach Tino at <a href="mailto:cardenestino@gmail.com">cardenestino@gmail.com</a>
        </p>
      </noscript>
    </main>

    <!--
      Templates for the book's pages, filled in by src/render.ts:
        {{key}}               is replaced by a piece of text (in text or in an attribute);
        <slot name="key">     is replaced by content from book.md (paragraphs, links, …);
        data-if="key"         keeps the element only when key has a value;
        data-style="…"        becomes style="…" (so the editor doesn't flag {{key}} as broken CSS).
      Line breaks and indentation between tags are ignored, so lay them out freely.

      Styling is Tailwind classes for one-off layout, and named classes from
      src/styles.css for what recurs or depends on the page (.page, .staff,
      .text-link, …). Colours: paper, ink, ink-soft, rule, accent, henle, cover-ink,
      desk. Fonts: font-serif, font-display, font-caps, font-music.
      Lengths in cqi are fractions of the page's width (1cqi = 1%).
      Attributes like data-body and data-page-of are hooks for the scripts; keep them.
    -->

    <!-- ── Pages ─────────────────────────────────────────────────────────── -->

    <!-- Every page. kind is cover, back, text, full or blank. The page number and
         the numbers in [data-page-of] are filled in by layout.ts. -->
    <template data-template="page">
      <div class="page page--{{kind}} {{contentsClass}}" id="{{id}}" data-title="{{title}}" data-density="{{density}}" data-left="{{left}}">
        <span class="page-number" data-page-number data-if="numbered"></span>
        <div class="page-body {{bodyClass}}" data-body><slot name="body"></slot></div>
        <span class="page-plate" aria-hidden="true" data-if="plate">{{plate}}</span>
        <a class="absolute inset-0 z-3" href="#p2" data-turn="next" data-if="isCover"><span class="sr-only">Open</span></a>
      </div>
    </template>

    <!-- :::back: the main part centred on the page, and what follows its --- at the foot, under a rule. -->
    <template data-template="back">
      <div class="flex-1 flex flex-col justify-center gap-[0.2em]"><slot name="main"></slot></div>
      <footer class="back-foot" data-if="foot"><slot name="foot"></slot></footer>
    </template>

    <!-- :::cover -->
    <template data-template="cover">
      <div class="absolute inset-0">
        <!-- The composer's name, large, set flush left across the top. -->
        <p class="absolute top-[15%] left-[10%] m-0 text-[3em] leading-none whitespace-nowrap" data-if="name">{{name}}</p>
        <!-- Below it, two columns: a label on the left, the title block on the right,
             with hairline rules spanning the right column. -->
        <div class="absolute top-[30.5%] bottom-[6%] left-[10%] right-[8%] grid grid-cols-[28cqi_1fr] grid-rows-[auto_1fr_auto]">
          <p class="m-0 pt-[6cqi] font-semibold text-[3.9cqi]">{{label}}</p>
          <div class="cover-text pt-[6cqi] border-t border-cover-ink text-[2.3cqi] leading-[1.3]">
            <slot name="text"></slot>
          </div>
          <div class="col-2 row-3">
            <p class="m-0 text-[4cqi]" data-if="publisher">{{publisher}}</p>
            <p class="m-0 mt-[5cqi] pt-[7cqi] border-t border-cover-ink text-[2cqi]">{{number}}</p>
          </div>
        </div>
        <p class="absolute bottom-[3%] right-[3%] text-black m-0 text-[5cqi] animate-pulse"><i class="fa-regular fa-hand-pointer"></i></p>
      </div>
    </template>

    <!-- A page title (# or ##): title, subtitle composer (top right), staff. -->
    <template data-template="score-heading">
      <!-- The gap below shrinks with --squeeze, like the line spacing (see .page-body). -->
      <header class="mb-[calc(2rem*var(--squeeze,1))] text-center">
        <h1 class="score-title" id="{{id}}" data-if="h1"><slot name="title"></slot></h1>
        <h2 class="score-title" id="{{id}}" data-if="h2"><slot name="title"></slot></h2>
        <p class="mt-[0.35em] mb-0 font-display italic text-[1.12em] text-ink-soft" data-if="subtitle">{{subtitle}}</p>
      </header>
    </template>

    <!-- ── Block directives ──────────────────────────────────────────────── -->

    <!-- ::score and ::plate. kind is score, portrait or figure; fill is true when it fills the rest of the page. -->
    <template data-template="plate">
      <figure class="plate plate--{{kind}}" data-fill="{{fill}}" data-style="--plate-width: {{width}}">
        <img src="{{src}}" alt="{{alt}}" loading="{{loading}}" decoding="async" />
        <figcaption data-if="caption">{{caption}}</figcaption>
      </figure>
    </template>

    <!-- ::contents, the site map: each title, each ::part once, and the back cover. -->
    <template data-template="contents">
      <ol class="mt-[0.4em] pl-[1.4em] list-none" id="toc" aria-label="Contents">
        <slot name="entries"></slot>
        <li data-if="hasBack">
          <a class="group flex items-baseline py-[0.18em] no-underline" href="#back">
            <span class="group-hover:text-accent">Contact</span>
            <span class="leader" aria-hidden="true"></span>
            <span class="italic text-ink-soft">back cover</span>
          </a>
        </li>
      </ol>
    </template>

    <template data-template="contents-entry">
      <li>
        <a class="group flex items-baseline py-[0.18em] no-underline" href="#{{id}}">
          <span class="group-hover:text-accent">{{title}}<span class="ml-[0.5em] italic text-[0.9em] text-ink-soft" data-if="detail">{{detail}}</span></span>
          <span class="leader" aria-hidden="true"></span>
          <span class="oldstyle-nums tabular-nums" data-page-of="{{id}}"></span>
        </a>
      </li>
    </template>

    <!-- :::incipits, a thematic index: number, title centred over the first line of
         music, page number. Every image is clipped to the same 10:1 strip. -->
    <template data-template="incipits">
      <ol class="m-0 p-0 list-none" aria-label="Thematic index">
        <slot name="entries"></slot>
      </ol>
    </template>

    <template data-template="incipit">
      <li class="[&+&]:mt-[2em]">
        <a class="group grid grid-cols-[1.5em_1fr_1.5em] items-center gap-x-[0.75em] no-underline" href="#{{id}}">
          <span class="row-span-2 font-caps text-ink-soft/80 text-sm ">{{number}}</span>
          <span class="mb-[0.15em] leading-tight text-center group-hover:text-accent">{{title}}<span class="ml-[0.5em] italic text-[0.9em] text-ink-soft" data-if="detail">{{detail}}</span></span>
          <span class="row-span-2 text-right oldstyle-nums tabular-nums" data-page-of="{{id}}"></span>
          <img class="col-2 block w-full aspect-[10/1] object-cover object-left mix-blend-multiply" src="{{src}}" alt="" data-if="src" />
          <!-- Until there's an image: an empty staff. -->
          <span class="col-2 flex items-center aspect-[10/1]" data-if="noSrc">TODO: Fill </span>
        </a>
      </li>
    </template>

    <!-- ::youtube. The thumbnail is swapped for the player on click (see reader.ts). -->
    <template data-template="youtube">
      <!-- my-auto centres the video in the space between the title and the text below it.
           (pb rather than mb keeps the gap when the page is full and the auto margins are 0.) -->
      <figure class="mx-0 my-auto pb-[1.2em]">
        <div class="video" data-style="aspect-ratio: {{width}} / {{height}}; max-width: calc(60cqi * {{ratio}})" data-yt="{{id}}" data-title="{{title}}">
          <button type="button" class="yt-play" aria-label="Play {{title}}">
            <img src="https://i.ytimg.com/vi/{{id}}/hqdefault.jpg" alt="" loading="lazy" decoding="async" />
            <span aria-hidden="true"><svg viewBox="0 0 5 6"><path d="M0 0 5 3 0 6z" /></svg></span>
          </button>
        </div>
        <figcaption class="mt-[0.45em] text-center">
          <a class="text-link italic text-[0.8em]" href="https://www.youtube.com/watch?v={{id}}">Watch on YouTube →</a>
        </figcaption>
      </figure>
    </template>

    <!-- :::work, a page to itself: number, title, role, picture (a filling ::plate), description, link.
         number counts up through the book. -->
    <template data-template="work">
      <section class="work">
        <header class="mb-[1em] text-center">
          <p class="m-0 font-caps tracking-[0.12em] text-ink-soft">No. {{number}}</p>
          <h3 class="mt-[0.1em] mb-0 font-display font-medium text-[1.6em] leading-[1.15] text-balance">{{title}}</h3>
          <p class="mt-[0.2em] mb-0 italic text-ink-soft" data-if="role">{{role}}</p>
        </header>
        <slot name="image"></slot>
        <div class="mt-[1em]"><slot name="body"></slot></div>
        <a class="text-link self-center mt-auto pt-[1em] font-caps font-medium tracking-wide" href="{{href}}" data-if="href">{{label}} →</a>
      </section>
    </template>

    <!-- :::links, a row of links at the foot of the page (the list and links are styled in src/styles.css). -->
    <template data-template="links">
      <nav class="page-links mt-auto pt-[calc(1.2em*var(--squeeze,1))] font-caps font-medium tracking-wide">
        <slot name="body"></slot>
      </nav>
    </template>


    <!-- ::signature[text] -->
    <template data-template="signature">
      <p class="mt-[1.4em] mb-0 text-right italic text-ink-soft"><slot name="text"></slot></p>
    </template>

    <!-- ::continued[text] -->
    <template data-template="continued">
      <p class="mt-0 mb-[1.6em] text-center font-display italic text-ink-soft"><slot name="text"></slot> (continued)</p>
    </template>

    <!-- ── Inline directives ─────────────────────────────────────────────── -->

    <!-- :download[label]{href} -->
    <template data-template="download">
      <a href="{{href}}" download><slot name="label"></slot></a>
    </template>

    <!-- :sc[text] -->
    <template data-template="sc">
      <span class="font-medium text-xl tracking-wider"><slot name="text"></slot></span>
    </template>

    <!-- :pageref{to}, or :pageref[label]{to}. label ends in ", " when given. -->
    <template data-template="pageref">
      <a href="#{{to}}"><slot name="label"></slot>p. <span data-page-of="{{to}}"></span></a>
    </template>

    <!-- Shown in place of the book when book.md can't be loaded or has a mistake. -->
    <template data-template="book-error">
      <p class="max-w-xl mx-auto my-12 px-5 py-4 bg-paper text-lg">{{message}}</p>
    </template>
  </body>
</html>
